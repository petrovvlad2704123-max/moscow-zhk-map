function showZhk(zhk) {
  entranceLayer.clearLayers();
  zhk.corpuses.forEach(c => {
    if (c.porches && c.porches.length) {
      c.porches.forEach(p => {
        const em = L.circleMarker([p.lat,p.lon], {radius:4, fillColor:'#e8c87a', color:'#1a1a1a', weight:1, fillOpacity:0.9});

      });

document.getElementById('info-close').addEventListener('click', () => {
  document.getElementById('info-panel').classList.remove('open');

});
const searchInput = document.getElementById('search-input');

  const q = searchInput.value.trim().toLowerCase();
  if (!q) { searchResults.classList.remove('open'); return; }
  const matches = ZHK_DATA.filter(z => z.name.toLowerCase().includes(q)).slice(0,30);
  searchResults.innerHTML = matches.map(z => '<div class="item" data-name="'+escapeAttr(z.name)+'">'+escapeHtml(z.name)+'</div>').join('') || '<div class="item">Ничего</div>';

      searchResults.classList.remove('open');
    });
  });
  searchResults.classList.add('open');
});
document.addEventListener('click', e => { if (!e.target.closest('.search-box')) searchResults.classList.remove('open'); });
function escapeHtml(s) { return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s) { return escapeHtml(s); }
